<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1165" width="960" height="1165" role="img" aria-label="Process flow for each run of the Video Channel Health Monitor: channel list, then 3 YouTube Data API v3 steps (find each channel, recent uploads, upload details), then sort by format, snapshot saved, score and report">
  <title>Process flow for each run</title>
  <desc>Step 1, channel list: channels.json holds 10 channels with pinned channel IDs. One channels.json entry at a time goes into the YouTube Data API v3 band. Step 2, find each channel: 1st try channels.list by pinned ID (1 unit), 2nd try channels.list by @handle (1 unit), 3rd try search.list by name (1 call from its own allowance of 100 a day) and then channels.list (1 unit). A channel found by handle or search is skipped if its title doesn't contain the expected name. The uploads playlist ID goes to step 3, recent uploads: playlistItems.list on the uploads playlist, newest first, 50 per page (1 unit per page), stopping at 200 uploads or once a page reaches uploads over 365 days old. Up to 200 video IDs go to step 4, upload details: videos.list with 50 IDs per call (1 unit per call), parts snippet, contentDetails, statistics, liveStreamingDetails and player; orientation is read from the player size. The API client counts quota units, retries server errors and rate limits, stops cleanly when the daily quota runs out, and reads the key from the YOUTUBE_API_KEY environment variable without logging it. Steps 2 to 6 run for each channel in turn. JSON items go to step 5, sort by format: Videos, Shorts, Live and premieres, or Scheduled or live now, which is not scored; hidden view counts are stored as NULL and left out of scoring. Upload rows go to step 6, snapshot saved: data/channel_health.db with tables runs, channels and videos; snapshots older than 30 days are deleted at the start of each run. The latest snapshot goes to step 7, score: expected views at each upload's age, per channel and format, with flags above or below expected for uploads from the last 30 days. Expected views and flags go to step 8, report: report/index.html with the channel summary, flagged uploads, views gained since the previous snapshot, the run log and a terms note. Steps 1 to 6 are the fetch command and steps 7 and 8 the report command. Snapshot 1: 10 channels, 64 calls, 64 of 10,000 daily quota units: 10 channels.list, 27 playlistItems.list and 27 videos.list calls, and 0 searches.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1.5 L10,5 L0,8.5 Z" fill="#57606A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="1165" fill="#FFFFFF"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#1F2328" style="font-variant-ligatures: none">
    <text x="40" y="34" font-size="18" font-weight="700">Process flow for each run</text>
    <text x="40" y="57" font-size="13" fill="#57606A"><tspan font-family="Consolas, Menlo, monospace">python channel_health.py all</tspan>: <tspan font-family="Consolas, Menlo, monospace">fetch</tspan> (steps 1-6), then <tspan font-family="Consolas, Menlo, monospace">report</tspan> (steps 7-8)</text>
    <rect x="40" y="74" width="880" height="48" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="66" cy="99" r="12" fill="#1F2328"/>
    <text x="66" y="104" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
    <text x="92" y="104" font-size="16" font-weight="700">Channel list</text>
    <path d="M276,89 H286 L291,94 V109 H276 Z" fill="#FFFFFF" stroke="#57606A" stroke-width="1.25" stroke-linejoin="round"/>
    <path d="M286,89 V94 H291" fill="none" stroke="#57606A" stroke-width="1.25" stroke-linejoin="round"/>
    <text x="300" y="104" font-size="14"><tspan font-family="Consolas, Menlo, monospace">channels.json</tspan>: 10 channels with pinned channel IDs</text>
    <rect x="24" y="150" width="912" height="480" rx="12" fill="#F3F8FD" stroke="#0969DA" stroke-width="1.5"/>
    <text x="92" y="186" font-size="16" fill="#0969DA" font-weight="700">YouTube Data API v3</text>
    <text x="92" y="208" font-size="13" fill="#57606A">Steps 2-6 run for</text>
    <text x="92" y="227" font-size="13" fill="#57606A">each channel in turn</text>
    <rect x="310" y="166" width="610" height="72" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-dasharray="4 3"/>
    <text x="324" y="186" font-size="13"><tspan font-weight="700">API client:</tspan> counts quota units and retries server errors and rate limits</text>
    <text x="324" y="205" font-size="13">Stops cleanly when the daily quota runs out</text>
    <text x="324" y="224" font-size="13">Reads the key from the <tspan font-family="Consolas, Menlo, monospace">YOUTUBE_API_KEY</tspan> environment variable and never logs it</text>
    <rect x="40" y="254" width="880" height="134" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
    <circle cx="66" cy="279" r="12" fill="#1F2328"/>
    <text x="66" y="284" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
    <text x="92" y="284" font-size="16" font-weight="700">Find each channel</text>
    <text x="92" y="314" font-size="13" fill="#57606A">Tried in order until</text>
    <text x="92" y="344" font-size="13" fill="#57606A">one finds the channel</text>
    <text x="276" y="284" font-size="13" fill="#57606A" font-weight="600">1st</text>
    <text x="276" y="314" font-size="13" fill="#57606A" font-weight="600">2nd</text>
    <text x="276" y="344" font-size="13" fill="#57606A" font-weight="600">3rd</text>
    <rect x="310" y="269" width="129" height="22" rx="4" fill="#FFFFFF" stroke="#0969DA" stroke-width="1.25"/>
    <text x="374.5" y="284" font-size="13" fill="#0969DA" text-anchor="middle" font-family="Consolas, Menlo, monospace">channels.list</text>
    <text x="449" y="284" font-size="14">by pinned ID</text>
    <text x="904" y="284" font-size="13" fill="#57606A" text-anchor="end">1 unit</text>
    <rect x="310" y="299" width="129" height="22" rx="4" fill="#FFFFFF" stroke="#0969DA" stroke-width="1.25"/>
    <text x="374.5" y="314" font-size="13" fill="#0969DA" text-anchor="middle" font-family="Consolas, Menlo, monospace">channels.list</text>
    <text x="449" y="314" font-size="14">by @handle</text>
    <text x="904" y="314" font-size="13" fill="#57606A" text-anchor="end">1 unit</text>
    <rect x="310" y="329" width="113" height="22" rx="4" fill="#FFFFFF" stroke="#0969DA" stroke-width="1.25"/>
    <text x="366.5" y="344" font-size="13" fill="#0969DA" text-anchor="middle" font-family="Consolas, Menlo, monospace">search.list</text>
    <text x="484" y="344" font-size="14" text-anchor="middle">by name, then</text>
    <rect x="545" y="329" width="129" height="22" rx="4" fill="#FFFFFF" stroke="#0969DA" stroke-width="1.25"/>
    <text x="609.5" y="344" font-size="13" fill="#0969DA" text-anchor="middle" font-family="Consolas, Menlo, monospace">channels.list</text>
    <text x="904" y="344" font-size="13" fill="#57606A" text-anchor="end">1 of 100 daily searches, 1 unit</text>
    <text x="276" y="370" font-size="14"><tspan font-weight="700">Name check:</tspan> skips a handle or search match whose title lacks the expected name</text>
    <path d="M66,388 V414" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="80" y="408" font-size="13" fill="#57606A">uploads playlist ID</text>
