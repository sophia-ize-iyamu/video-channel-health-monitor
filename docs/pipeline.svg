    <rect x="40" y="884" width="880" height="76" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="66" cy="909" r="12" fill="#1F2328"/>
    <text x="66" y="914" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
