    <rect x="417" y="925" width="133" height="22" rx="11" fill="#F6E5E3" stroke="#B42318" stroke-width="1.25"/>
    <text x="483.5" y="940" font-size="13" fill="#B42318" font-weight="600" text-anchor="middle">Below expected</text>
    <text x="560" y="940" font-size="14">flags for uploads from the last 30 days</text>
    <path d="M66,960 V986" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="80" y="980" font-size="13" fill="#57606A">expected views and flags</text>
    <rect x="40" y="988" width="880" height="92" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="66" cy="1013" r="12" fill="#1F2328"/>
    <text x="66" y="1018" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text>
    <text x="92" y="1018" font-size="16" font-weight="700">Report</text>
    <path d="M276,1003 H286 L291,1008 V1023 H276 Z" fill="#FFFFFF" stroke="#57606A" stroke-width="1.25" stroke-linejoin="round"/>
    <path d="M286,1003 V1008 H291" fill="none" stroke="#57606A" stroke-width="1.25" stroke-linejoin="round"/>
    <text x="300" y="1018" font-size="14"><tspan font-family="Consolas, Menlo, monospace">report/index.html</tspan>: channel summary and flagged uploads</text>
    <text x="276" y="1040" font-size="14">Views gained since the previous snapshot</text>
    <text x="276" y="1062" font-size="14">Run log and a terms note</text>
    <path d="M40,1100 H920" fill="none" stroke="#D0D7DE"/>
    <text x="40" y="1126" font-size="14"><tspan font-weight="700">Snapshot 1:</tspan> 10 channels, 64 calls, 64 of 10,000 daily quota units</text>
    <text x="40" y="1147" font-size="13" fill="#57606A">64 calls = 10 <tspan font-family="Consolas, Menlo, monospace">channels.list</tspan> + 27 <tspan font-family="Consolas, Menlo, monospace">playlistItems.list</tspan> + 27 <tspan font-family="Consolas, Menlo, monospace">videos.list</tspan>, and 0 searches</text>
  </g>
</svg>
