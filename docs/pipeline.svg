    <text x="92" y="472" font-size="13" fill="#57606A">Newest first</text>
    <rect x="276" y="431" width="169" height="22" rx="4" fill="#FFFFFF" stroke="#0969DA" stroke-width="1.25"/>
    <text x="360.5" y="446" font-size="13" fill="#0969DA" text-anchor="middle" font-family="Consolas, Menlo, monospace">playlistItems.list</text>
    <text x="455" y="446" font-size="14">on the uploads playlist, 50 per page</text>
    <text x="904" y="446" font-size="13" fill="#57606A" text-anchor="end">1 unit per page</text>
    <text x="276" y="472" font-size="14">Stops at 200 uploads, or once a page reaches uploads over 365 days old</text>
    <path d="M66,490 V516" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="80" y="510" font-size="13" fill="#57606A">up to 200 video IDs</text>
    <rect x="40" y="518" width="880" height="96" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
    <circle cx="66" cy="543" r="12" fill="#1F2328"/>
    <text x="66" y="548" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
    <text x="92" y="548" font-size="16" font-weight="700">Upload details</text>
    <rect x="276" y="533" width="113" height="22" rx="4" fill="#FFFFFF" stroke="#0969DA" stroke-width="1.25"/>
    <text x="332.5" y="548" font-size="13" fill="#0969DA" text-anchor="middle" font-family="Consolas, Menlo, monospace">videos.list</text>
    <text x="399" y="548" font-size="14">50 IDs per call</text>
    <text x="904" y="548" font-size="13" fill="#57606A" text-anchor="end">1 unit per call</text>
    <text x="276" y="574" font-size="14">Parts: <tspan font-family="Consolas, Menlo, monospace">snippet, contentDetails, statistics, liveStreamingDetails, player</tspan></text>
    <text x="276" y="596" font-size="14">Orientation is read from the player size</text>
    <path d="M66,122 V252" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="80" y="141" font-size="13" fill="#57606A">one <tspan font-family="Consolas, Menlo, monospace">channels.json</tspan> entry at a time</text>
    <path d="M66,614 V656" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="80" y="650" font-size="13" fill="#57606A">JSON items</text>
    <rect x="40" y="658" width="880" height="74" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="66" cy="683" r="12" fill="#1F2328"/>
    <text x="66" y="688" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
    <text x="92" y="688" font-size="16" font-weight="700">Sort by format</text>
    <rect x="276" y="673" width="68" height="22" rx="11" fill="#D5DFE5" stroke="#2F5D7C" stroke-width="1.25"/>
