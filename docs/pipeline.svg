    <rect x="352" y="673" width="68" height="22" rx="11" fill="#F7E6D5" stroke="#D9822B" stroke-width="1.25"/>
    <text x="386" y="688" font-size="13" text-anchor="middle">Shorts</text>
    <rect x="428" y="673" width="155" height="22" rx="11" fill="#E1E8D3" stroke="#6B8E23" stroke-width="1.25"/>
    <text x="505.5" y="688" font-size="13" text-anchor="middle">Live and premieres</text>
    <rect x="591" y="673" width="177" height="22" rx="11" fill="#EAECEF" stroke="#8C959F" stroke-width="1.25"/>
