    <text x="92" y="816" font-size="13" fill="#57606A">Kept for 30 days</text>
    <path d="M276,774 V792 A11.0,4 0 0 0 298,792 V774" fill="#F3F0FB" stroke="#6E40C9" stroke-width="1.5"/>
    <ellipse cx="287.0" cy="774" rx="11.0" ry="4" fill="#F3F0FB" stroke="#6E40C9" stroke-width="1.5"/>
    <text x="308" y="790" font-size="14"><tspan font-family="Consolas, Menlo, monospace" fill="#6E40C9">data/channel_health.db</tspan></text>
    <text x="276" y="816" font-size="14">Tables: <tspan font-family="Consolas, Menlo, monospace">runs, channels, videos</tspan></text>
    <text x="276" y="838" font-size="14">Snapshots older than 30 days are deleted at the start of each run</text>
    <path d="M66,856 V882" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/>
